name: check

# Runs on every push and pull request: the figures must rebuild the canonical HTMLs byte for byte,
# and the published HTMLs must have no duplicate ids, no internal links without a target, and
# a consistent reference list.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Figures rebuild the HTMLs byte for byte
        working-directory: tutorial/figures
        run: python3 assemble.py --check
      - name: Lingua Franca HTMLs, structure and links
        run: python3 .github/scripts/check_html.py tutorial/lingua_franca_tutorial.html tutorial/lingua_franca_rti.html
      - name: HW-RTI specification, structure and links
        run: python3 .github/scripts/check_html.py --no-figure-ids hw-rti/HW-RTI_project_specification.html
