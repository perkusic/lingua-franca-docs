<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two message sequence charts for a tag at which src sends nothing: in micro-LF dst waits until its deadline; under centralized coordination the RTI grants the tag after src reports completion" class="anim" style="--n:3"><defs><marker id="mk-f-smsc2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="190" y="22" text-anchor="middle" class="svgtxt" font-size="10" fill="#854F0B" font-weight="600">micro-LF, @maxwait(150ms)</text><rect x="40" y="32" width="80" height="24" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="80.0" y="47.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">src</text><line x1="80" y1="56" x2="80" y2="330" stroke="#8A867B" stroke-width="1.2"/><rect x="260" y="32" width="80" height="24" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="300.0" y="47.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">dst</text><line x1="300" y1="56" x2="300" y2="330" stroke="#8A867B" stroke-width="1.2"/><text x="580" y="22" text-anchor="middle" class="svgtxt" font-size="10" fill="#042C53" font-weight="600">reactor-c, centralized (Lesson 4)</text><rect x="414" y="32" width="72" height="24" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="450.0" y="47.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">src</text><line x1="450" y1="56" x2="450" y2="330" stroke="#8A867B" stroke-width="1.2"/><rect x="544" y="32" width="72" height="24" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="580.0" y="47.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">RTI</text><line x1="580" y1="56" x2="580" y2="330" stroke="#8A867B" stroke-width="1.2"/><rect x="674" y="32" width="72" height="24" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="710.0" y="47.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">dst</text><line x1="710" y1="56" x2="710" y2="330" stroke="#8A867B" stroke-width="1.2"/><g class="st" style="--i:0"><text x="72" y="84" text-anchor="end" class="svgtxt" font-size="8.5" fill="#1B1E22">200 ms:</text><text x="86" y="84" text-anchor="start" class="svgtxt" font-size="8.5" fill="#5C6066">no output</text><text x="306" y="84" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">200 ms: in</text><text x="306" y="96" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">unresolved</text><rect x="294" y="104" width="12" height="96" rx="3" fill="#FAF0DC" stroke="#9A6410"/><text x="288" y="156" text-anchor="end" class="svgtxt" font-size="8.5" fill="#854F0B">waits W</text><text x="310" y="206" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">350 ms: commit,</text><text x="310" y="218" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">in absent</text><text x="190" y="262" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">no message at all crosses</text><text x="190" y="274" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">the network for this tag</text><text x="190" y="300" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B" font-weight="600">cost: W, every silent tag</text><circle cx="18" cy="90" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="18" y="93.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="710" y1="80" x2="580" y2="92" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-smsc2)"/><text x="650" y="78" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">NET(200)</text><text x="444" y="112" tex