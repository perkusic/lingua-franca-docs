<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Message sequence: two federates join, synchronize clocks and agree on a start time with the RTI" class="anim" style="--n:9"><defs><marker id="mk-join" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect x="53.0" y="12" width="104" height="34" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="105" y="33" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">Federate A</text><line x1="105" y1="46" x2="105" y2="374" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="305.0" y="12" width="150" height="42" rx="8" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="380" y="28" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#1B1E22" font-weight="500">RTI</text><text x="380" y="44" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">one thread per federate</text><line x1="380" y1="54" x2="380" y2="374" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="603.0" y="12" width="104" height="34" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="655" y="33" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">Federate B</text><line x1="655" y1="46" x2="655" y2="374" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><g class="st" style="--i:0"><line x1="111" y1="76" x2="370" y2="76" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="70.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">FED_IDS: federate id + federation id</text><circle cx="83" cy="76" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="83" y="79.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="374" y1="102" x2="115" y2="102" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="96.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">ACK (or REJECT with a cause)</text><circle cx="83" cy="102" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="83" y="105.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text></g><g class="st" style="--i:2"><line x1="111" y1="128" x2="370" y2="128" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="122.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">NEIGHBOR_STRUCTURE: upstreams, delays, downstreams</text><circle cx="83" cy="128" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="83" y="131.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text></g><g class="st" style="--i:3"><line x1="111" y1="154" x2="370" y2="154" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="148.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">UDP_PORT</text><circle cx="83" cy="154" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="83" y="157.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">4</text><line x1="374" y1="166" x2="111" y2="169" stroke="#8A867B" stroke-width="0.8"/><line x1="374" y1="174" x2="111" y2="177" stroke="#8A867B" stroke-width="0.8"/><line x1="374" y1="182" x2="111" y2="185" stroke="#8A867B" stroke-width="0.8"/><text x="242.5" y="196" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">clock sync T1 / T3, 10 rounds (-c init)</text><text x="390" y="178" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">thread for A started;</text><text x="390" y="190" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">accept the next federate</text></g><g class="st" style="--i:4"><rect x="597" y="66" width="116" height="118" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1" stroke-dasharray="5 4"/><text x="655" y="110" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">steps 1&#8211;4</text><text x="655" y="126" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">for B, the same</text><line x1="595" y1="124" x2="388" y2="124" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#mk-join)"/><circle cx="727" cy="76" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="727" y="79.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">5</text></g><g class="st" style="--i:5"><line x1="111" y1="224" x2="370" y2="224" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="218.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">TIMESTAMP(t_A): proposed start</text><circle cx="83" cy="224" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="83" y="227.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">6</text><rect x="100" y="228" width="10" height="110" rx="2" fill="#E8F0F9" stroke="#185FA5" stroke-width="1"/><text x="117" y="244" text-anchor="start" class="svgtxt" font-size="9" fill="#185FA5">A blocks</text><text x="370" y="240" text-anchor="end" class="svgtxt" font-size="9" fill="#5C6066">thread waits: received_start_times</text></g><g class="st" style="--i:6"><line x1="649" y1="254" x2="390" y2="254" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="517.5" y="248.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">TIMESTAMP(t_B): last proposal</text><circle cx="677" cy="254" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="677" y="257.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">7</text><text x="390" y="272" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">wake all; startup &#8594; execution</text></g><g class="st" style="--i:7"><rect x="230" y="280" width="300" height="40" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="380.0" y="296.525" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#04342C" font-weight="500">start_time = max(t_A, t_B) + DELAY_START</text><text x="380.0" y="311.22499999999997" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#0F6E56">DELAY_START = 1 s</text><circle cx="216" cy="300" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="216" y="303.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">8</text></g><g class="st" style="--i:8"><line x1="374" y1="340" x2="115" y2="340" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="242.5" y="334.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">TIMESTAMP(start_time)</text><line x1="386" y1="340" x2="645" y2="340" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-join)"/><text x="517.5" y="334.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">TIMESTAMP(start_time)</text><circle cx="380" cy="358" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="380" y="361.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">9</text><text x="380.0" y="396" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">each federate: PENDING &#8594; GRANTED; nothing else is written to it before this</text></g></svg>