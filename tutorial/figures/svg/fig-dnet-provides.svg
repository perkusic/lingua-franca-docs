<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DNET suppressing next-event traffic from the source">
<defs><marker id="ahP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<line x1="60" y1="96" x2="716" y2="96" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="60" y="126" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">0</text>
<text x="716" y="126" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">20 ms</text>
<line x1="404" y1="66" x2="404" y2="126" stroke="#9A6410" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="404" y="58" text-anchor="middle" class="svgtxt" font-size="10.5" font-weight="500" fill="#633806">DNET(S) = (10ms, UINT_MAX)</text>
<text x="224" y="146" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">ticks here change no decision anywhere &mdash; suppressed</text>
<text x="556" y="146" text-anchor="middle" class="svgtxt" font-size="10" fill="#04342C">a next event here could unblock someone &mdash; reported</text>
<g stroke="#B4B2A9" stroke-width="1.2">
<line x1="93" y1="88" x2="93" y2="104"/><line x1="126" y1="88" x2="126" y2="104"/><line x1="159" y1="88" x2="159" y2="104"/>
<line x1="191" y1="88" x2="191" y2="104"/><line x1="224" y1="88" x2="224" y2="104"/><line x1="257" y1="88" x2="257" y2="104"/>
<line x1="290" y1="88" x2="290" y2="104"/><line x1="323" y1="88" x2="323" y2="104"/><line x1="355" y1="88" x2="355" y2="104"/><line x1="388" y1="88" x2="388" y2="104"/>
</g>
<g stroke="#0F6E56" stroke-width="1.6">
<line x1="421" y1="84" x2="421" y2="108"/><line x1="454" y1="84" x2="454" y2="108"/><line x1="487" y1="84" x2="487" y2="108"/>
<line x1="519" y1="84" x2="519" y2="108"/><line x1="552" y1="84" x2="552" y2="108"/><line x1="585" y1="84" x2="585" y2="108"/>
<line x1="618" y1="84" x2="618" y2="108"/><line x1="651" y1="84" x2="651" y2="108"/><line x1="684" y1="84" x2="684" y2="108"/>
</g>
<text x="380" y="180" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">A and B are never sent a DNET at all: cycle members are governed by the PTAG machinery instead</text>
<text x="380" y="196" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">and a DNET earlier than the federation start tag is suppressed as meaningless</text>
</svg>