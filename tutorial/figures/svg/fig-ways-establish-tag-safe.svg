<svg viewBox="0 0 760 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Centralized and decentralized coordination compared: an RTI that issues grants from logical knowledge, and micro-LF federates that decide locally from received tags, maxwait and a synchronized clock" class="anim" style="--n:4"><defs><marker id="mk-uc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><g class="st" style="--i:0"><circle cx="136" cy="32" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="136" y="35.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><rect x="150" y="12" width="460" height="40" rx="8" fill="#F2F0E9" stroke="#8A867B" stroke-width="1"/><text x="380" y="29" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">federate F, about to process tag g = (t, m):</text><text x="380" y="44" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">can a message with a tag &#8804; g still arrive on one of its inputs?</text></g><line x1="380" y1="64" x2="380" y2="418" stroke="#D9D5CA" stroke-width="1"/><g class="st" style="--i:1"><circle cx="28" cy="76" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="28" y="79.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">2</text><text x="190" y="80" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="600">centralized: reactor-c (&#167;4), HW-RTI (&#167;9.9)</text><rect x="70" y="94" width="240" height="40" rx="9" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="190.0" y="110.525" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">federates report to the RTI</text><text x="190.0" y="125.22500000000001" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5">NET, LTC; messages pass through it</text><line x1="190" y1="134" x2="190" y2="150" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="40" y="152" width="300" height="54" rx="9" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="190.0" y="168.63750000000002" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">RTI: logical knowledge of the federation</text><text x="190.0" y="183.3375" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5">topology (min-delay matrix), each federate&#8217;s</text><text x="190.0" y="197.5875" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5">NET and LTC, messages in transit</text><line x1="190" y1="206" x2="190" y2="222" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="95" y="224" width="190" height="34" rx="9" fill="#fff" stroke="#185FA5" stroke-width="1.1"/><text x="190.0" y="244.4125" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">TAG(g) or PTAG(g) to F</text><line x1="190" y1="258" x2="190" y2="274" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="110" y="276" width="160" height="30" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="190.0" y="294.41249999999997" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#04342C" font-weight="500">F advances to g</text><text x="190" y="326" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53">evidence: promises, completions and topology</text></g><g class="st" style="--i:2"><circle cx="398" cy="76" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="398" y="79.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">3</text><text x="570" y="80" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B" font-weight="600">decentralized: micro-LF (reactor-uc)</text><rect x="401" y="94" width="108" height="54" rx="9" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="455.0" y="111.2" text-anchor="middle" class="svgtxt" font-size="10" fill="#854F0B" font-weight="500">last_known_tag</text><text x="455.0" y="125.15" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">per input, from</text><text x="455.0" y="138.65" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">TaggedMessages</text><line x1="455" y1="148" x2="529.75" y2="170" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="516" y="94" width="108" height="54" rx="9" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="570.0" y="111.2" text-anchor="middle" class="svgtxt" font-size="10" fill="#854F0B" font-weight="500">@maxwait W</text><text x="570.0" y="125.15" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">per connection</text><text x="570.0" y="138.65" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">or federate</text><line x1="570" y1="148" x2="570.0" y2="170" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="631" y="94" width="108" height="54" rx="9" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="685.0" y="111.2" text-anchor="middle" class="svgtxt" font-size="10" fill="#854F0B" font-weight="500">synchronized</text><text x="685.0" y="125.15" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">physical clock</text><text x="685.0" y="138.65" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">(grandmaster tree)</text><line x1="685" y1="148" x2="610.25" y2="170" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="420" y="172" width="300" height="52" rx="9" fill="#fff" stroke="#9A6410" stroke-width="1.1"/><text x="570.0" y="187.63750000000002" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B" font-weight="500">F decides locally (acquire_tag)</text><text x="570.0" y="202.3375" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#9A6410">input resolved if last_known_tag &#8805; g;</text><text x="570.0" y="216.5875" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#9A6410">otherwise wait until the clock reads t + W</text><line x1="570" y1="224" x2="570" y2="274" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-uc)"/><rect x="490" y="276" width="160" height="30" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="570.0" y="294.41249999999997" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#04342C" font-weight="500">F advances to g</text><text x="570" y="326" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B">evidence: received tags and a timing assumption</text></g><g class="st" style="--i:3"><circle cx="22" cy="374" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="22" y="377.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">4</text><rect x="40" y="346" width="320" height="56" rx="7" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1"/><text x="200" y="366" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">a federate is slow or silent:</text><text x="200" y="381" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22">no grant is issued, and F waits</text><text x="200" y="395" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">the failure is lost liveness, not a late value</text><rect x="400" y="346" width="340" height="56" rx="7" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1"/><text x="570" y="366" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">a message arrives later than assumed:</text><text x="570" y="381" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22">STP violation; event moved to (t&#8242;, m&#8242; + 1)</text><text x="570" y="395" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">tardy handler runs, or the body on the late value</text></g><text x="380.0" y="438" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">an architectural comparison: the two rest on different assumptions and give different guarantees</text></svg>