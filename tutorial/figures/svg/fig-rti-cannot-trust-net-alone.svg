<svg viewBox="0 0 760 334" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four frames: a message tagged 4 in flight, A reports NET 10, the RTI records 4, an LTC clears the queue" class="anim" style="--n:4"><defs><marker id="mk-intr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="316" y="26" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">A&#8217;s event queue</text><text x="316" y="40" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">what A knows</text><text x="430" y="26" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">in flight</text><text x="430" y="40" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">RTI &#8594; A</text><text x="548" y="26" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">in-transit queue</text><text x="548" y="40" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">kept by the RTI for A</text><text x="668" y="26" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">next_event(A)</text><text x="668" y="40" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">recorded by the RTI</text><text x="44" y="26" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">what happens</text><line x1="374" y1="50" x2="374" y2="320" stroke="#D9D5CA"/><line x1="486" y1="50" x2="486" y2="320" stroke="#D9D5CA"/><text x="316" y="330" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">federate side</text><text x="608.0" y="330" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">RTI side</text><g class="st" style="--i:0"><rect x="14" y="52" width="732" height="60" rx="8" fill="#fff" stroke="#E6E3DA"/><circle cx="28" cy="68" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="28" y="71.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="44" y="72" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">S sends A a message tagged 4;</text><text x="44" y="86" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">the RTI forwards it and</text><text x="44" y="100" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">inserts 4 into A&#8217;s queue</text><rect x="299.0" y="71" width="34" height="22" rx="4" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="316" y="86" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">10</text><rect x="410" y="71" width="40" height="22" rx="3" fill="#fff" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 2"/><text x="430" y="86" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="500">tag 4</text><line x1="452" y1="82" x2="452" y2="82" stroke="#185FA5"/><line x1="406" y1="82" x2="384" y2="82" stroke="#185FA5" stroke-width="1.2" marker-end="url(#mk-intr)"/><rect x="531.0" y="71" width="34" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="548" y="86" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B" font-weight="500">4</text><text x="548" y="106" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#854F0B">inserted</text><text x="668" y="86" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">not yet asked</text></g><g class="st" style="--i:1"><rect x="14" y="120" width="732" height="60" rx="8" fill="#FAFAF7" stroke="#E6E3DA"/><circle cx="28" cy="136" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="28" y="139.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text><text x="44" y="140" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">A has not seen it and</text><text x="44" y="154" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">reports NET(10) from its</text><text x="44" y="168" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">own queue</text><rect x="299.0" y="139" width="34" height="22" rx="4" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="316" y="154" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">10</text><text x="316" y="174" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">sends NET(10)</text><rect x="410" y="139" width="40" height="22" rx="3" fill="#fff" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 2"/><text x="430" y="154" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="500">tag 4</text><line x1="452" y1="150" x2="452" y2="150" stroke="#185FA5"/><line x1="406" y1="150" x2="384" y2="150" stroke="#185FA5" stroke-width="1.2" marker-end="url(#mk-intr)"/><rect x="531.0" y="139" width="34" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="548" y="154" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B" font-weight="500">4</text><text x="668" y="154" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5" font-weight="500">NET(10) arrives</text></g><g class="st" style="--i:2"><rect x="14" y="188" width="732" height="60" rx="8" fill="#fff" stroke="#E6E3DA"/><circle cx="28" cy="204" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="28" y="207.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text><text x="44" y="208" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">the RTI clamps:</text><text x="44" y="222" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">min(10, 4) = 4, so C, 10 ms</text><text x="44" y="236" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">downstream, is held below 14</text><rect x="299.0" y="207" width="34" height="22" rx="4" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="316" y="222" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">10</text><rect x="410" y="207" width="40" height="22" rx="3" fill="#fff" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 2"/><text x="430" y="222" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="500">tag 4</text><line x1="452" y1="218" x2="452" y2="218" stroke="#185FA5"/><line x1="406" y1="218" x2="384" y2="218" stroke="#185FA5" stroke-width="1.2" marker-end="url(#mk-intr)"/><rect x="531.0" y="207" width="34" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="548" y="222" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B" font-weight="500">4</text><rect x="648.0" y="207" width="40" height="22" rx="4" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="668" y="222" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#A32D2D" font-weight="500">4</text><text x="668" y="242" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D">min(10, 4)</text></g><g class="st" style="--i:3"><rect x="14" y="256" width="732" height="60" rx="8" fill="#FAFAF7" stroke="#E6E3DA"/><circle cx="28" cy="272" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="28" y="275.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">4</text><text x="44" y="276" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">the message lands; A runs</text><text x="44" y="290" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">tag 4, sends LTC(4); the RTI</text><text x="44" y="304" text-anchor="start" class="svgtxt" font-size="9.8" fill="#1B1E22">drops every entry &#8804; 4</text><rect x="279.0" y="275" width="34" height="22" rx="4" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="296" y="290" text-anchor="middle" cl