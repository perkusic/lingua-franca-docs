<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two timelines on the same physical time axis: a message arriving before the receiver advances, and one arriving after" class="anim" style="--n:2"><defs><marker id="mk-abs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="380.0" y="20" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">A sends to B at logical time g = 0; physical time on the axis, in ms after g</text><g class="st" style="--i:0"><circle cx="28" cy="50" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="28" y="53.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">1</text><text x="44" y="54" text-anchor="start" class="svgtxt" font-size="11.5" fill="#0F6E56" font-weight="600">Within the window</text><text x="44" y="69" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">after 100 ms (the lab&#8217;s FeedbackDecentralized)</text><text x="140" y="125" text-anchor="end" class="svgtxt" font-size="9.5" fill="#1B1E22">budget E+L+D</text><rect x="150.0" y="112" width="52.0" height="18" rx="2" fill="#E8F0F9" stroke="#185FA5"/><text x="176.0" y="125" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5" font-weight="600">D</text><rect x="202.0" y="112" width="26.0" height="18" rx="2" fill="#FAF0DC" stroke="#9A6410"/><text x="215.0" y="125" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#9A6410" font-weight="600">L</text><rect x="228.0" y="112" width="5.2" height="18" rx="2" fill="#F2F0E9" stroke="#8A867B"/><text x="239.2" y="125" text-anchor="start" class="svgtxt" font-size="9.5" fill="#1B1E22">= 16 ms  (D 10, L 5, E 1)</text><text x="140" y="158" text-anchor="end" class="svgtxt" font-size="9.5" fill="#1B1E22">message</text><line x1="150.0" y1="154" x2="202.0" y2="154" stroke="#185FA5" stroke-width="1" stroke-dasharray="2 3"/><line x1="202.0" y1="154" x2="225.0" y2="154" stroke="#185FA5" stroke-width="1.6" marker-end="url(#mk-abs)"/><circle cx="228.0" cy="154" r="4" fill="#185FA5"/><text x="236.0" y="158" text-anchor="start" class="svgtxt" font-size="9.5" fill="#042C53">arrives at 15</text><line x1="670.0" y1="98" x2="670.0" y2="176" stroke="#0F6E56" stroke-width="1.8"/><path d="M665.0 92 L675.0 92 L670.0 99 Z" fill="#0F6E56"/><text x="676.0" y="90" text-anchor="end" class="svgtxt" font-size="9.5" fill="#0F6E56" font-weight="500">tag g + 100 ms: B decides &#8220;absent&#8221; here</text><line x1="233.2" y1="190" x2="670.0" y2="190" stroke="#0F6E56" stroke-width="1.4"/><line x1="233.2" y1="185" x2="233.2" y2="195" stroke="#0F6E56" stroke-width="1.4"/><line x1="670.0" y1="185" x2="670.0" y2="195" stroke="#0F6E56" stroke-width="1.4"/><text x="451.6" y="206" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">margin = after &#8722; (E+L+D) = 84 ms &gt; 0: the message is in before B looks</text></g><g class="st" style="--i:1"><circle cx="28" cy="225" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="28" y="228.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">2</text><text x="44" y="229" text-anchor="start" class="svgtxt" font-size="11.5" fill="#A32D2D" font-weight="600">Late arrival</text><text x="44" y="244" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">after 1 ms, sender slowed by 50 ms (the lab&#8217;s violation recipe)</text><text x="140" y="300" text-anchor="end" class="svgtxt" font-size="9.5" fill="#1B1E22">budget E+L+D</text><rect x="150.0" y="287" width="260.0" height="18" rx="2" fill="#E8F0F9" stroke="#185FA5"/><text x="280.0" y="300" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5" font-weight="600">D</text><rect x="410.0" y="287" width="26.0" height="18" rx="2" fill="#FAF0DC" stroke="#9A6410"/><text 