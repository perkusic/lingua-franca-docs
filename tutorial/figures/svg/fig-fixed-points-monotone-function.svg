<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A monotone function on a chain, its fixed points, the Kleene iteration from the bottom, and a non-monotone function whose iteration never settles" class="anim" style="--n:5"><defs><marker id="mk-kl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><g class="st" style="--i:0"><circle cx="22" cy="24" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="22" y="27.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="200" y="24" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">a monotone f on the chain 0 &lt; 1 &lt; &#8230; &lt; 6</text><text x="200" y="40" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">f: 0&#8594;2, 1&#8594;2, 2&#8594;3, 3&#8594;3, 4&#8594;5, 5&#8594;5, 6&#8594;6</text><line x1="80" y1="300" x2="80" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="300" x2="320" y2="300" stroke="#ECE9E0" stroke-width="0.8"/><text x="80" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">0</text><text x="66" y="304" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">0</text><line x1="120" y1="300" x2="120" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="262" x2="320" y2="262" stroke="#ECE9E0" stroke-width="0.8"/><text x="120" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">1</text><text x="66" y="266" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">1</text><line x1="160" y1="300" x2="160" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="224" x2="320" y2="224" stroke="#ECE9E0" stroke-width="0.8"/><text x="160" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">2</text><text x="66" y="228" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">2</text><line x1="200" y1="300" x2="200" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="186" x2="320" y2="186" stroke="#ECE9E0" stroke-width="0.8"/><text x="200" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">3</text><text x="66" y="190" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">3</text><line x1="240" y1="300" x2="240" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="148" x2="320" y2="148" stroke="#ECE9E0" stroke-width="0.8"/><text x="240" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">4</text><text x="66" y="152" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">4</text><line x1="280" y1="300" x2="280" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="110" x2="320" y2="110" stroke="#ECE9E0" stroke-width="0.8"/><text x="280" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">5</text><text x="66" y="114" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">5</text><line x1="320" y1="300" x2="320" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><line x1="80" y1="72" x2="320" y2="72" stroke="#ECE9E0" stroke-width="0.8"/><text x="320" y="318" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">6</text><text x="66" y="76" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">6</text><text x="324" y="332" text-anchor="end" class="svgtxt" font-size="10" fill="#5C6066" font-weight="500">x</text><text x="50" y="62" text-anchor="start" class="svgtxt" font-size="10" fill="#5C6066" font-weight="500">f(x)</text><line x1="80" y1="300" x2="320" y2="72" stroke="#8A867B" stroke-width="1.1" stroke-dasharray="5 4"/><text x="248" y="74" text-anchor="end" class="svgtxt" font-size="9" fill="#8A867B">f(x) = x</text><line x1="80" y1="224" x2="120" y2="224" stroke="#185FA5" stroke-width="1" opacity="0.45"/><line x1="120" y1="224" x2="160" y2="186" stroke="#185FA5" stroke-width="1" opacity="0.45"/><line x1="160" y1="186" x2="200" y2="186" stroke="#185FA5" stroke-width="1" opacity="0.45"/><line x1="200" y1="186" x2="240" y2="110" stroke="#185FA5" stroke-width="1" opacity="0.45"/><line x1="240" y1="110" x2="280" y2="110" stroke="#185FA5" stroke-width="1" opacity="0.45"/><line x1="280" y1="110" x2="320" y2="72" stroke="#185FA5" stroke-width="1" opacity="0.45"/><circle cx="80" cy="224" r="4.5" fill="#185FA5"/><circle cx="120" cy="224" r="4.5" fill="#185FA5"/><circle cx="160" cy="186" r="4.5" fill="#185FA5"/><circle cx="200" cy="186" r="4.5" fill="#185FA5"/><circle cx="240" cy="110" r="4.5" fill="#185FA5"/><circle cx="280" cy="110" r="4.5" fill="#185FA5"/><circle cx="320" cy="72" r="4.5" fill="#185FA5"/></g><g class="st" style="--i:1"><circle cx="376" cy="66" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="376" y="69.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">2</text><circle cx="200" cy="186" r="10" fill="none" stroke="#0F6E56" stroke-width="1.8"/><circle cx="280" cy="110" r="10" fill="none" stroke="#0F6E56" stroke-width="1.8"/><circle cx="320" cy="72" r="10" fill="none" stroke="#0F6E56" stroke-width="1.8"/><text x="216" y="202" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">least</text><text x="390" y="70" text-anchor="start" class="svgtxt" font-size="10" fill="#04342C" font-weight="500">fixed points, where f meets the diagonal: 3, 5 and 6</text></g><g class="st" style="--i:2"><circle cx="376" cy="100" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="376" y="103.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">3</text><path d="M80 300 V230" stroke="#9A6410" stroke-width="2" fill="none" marker-end="url(#mk-kl)"/><path d="M80 224 H154" stroke="#9A6410" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#mk-kl)"/><path d="M160 224 V192" stroke="#9A6410" stroke-width="2" fill="none" marker-end="url(#mk-kl)"/><path d="M160 186 H192" stroke="#9A6410" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#mk-kl)"/><text x="88" y="292" text-anchor="start" class="svgtxt" font-size="11" fill="#854F0B" font-weight="600">&#8869;</text><text x="390" y="104" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">Kleene iteration from the bottom:</text><rect x="397.0" y="117" width="30" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="412" y="132" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="500">0</text><text x="412" y="152" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">&#8869;</text><rect x="447.0" y="117" width="30" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="462" y="132" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="500">2</text><text x="462" y="152" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">f(&#8869;)</text><line x1="428" y1="128" x2="446" y2="128" stroke="#9A6410" stroke-width="1.2" marker-end="url(#mk-kl)"/><rect x="497.0" y="117" width="30" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="512" y="132" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="500">3</text><text x="512" y="152" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">f&#178;(&#8869;)</text><line x1="478" y1="128" x2="496" y2="128" stroke="#9A6410" stroke-width="1.2" marker-end="url(#mk-kl)"/><rect x="547.0" y="117" width="30" height="22" rx="4" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="562" y="132" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="500">3</text><text x="562" y="152" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">f&#179;(&#8869;)</text><line x1="528" y1="128" x2="546" y2="128" stroke="#9A6410" stroke-width="1.2" marker-end="url(#mk-kl)"/><text x="596" y="125" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C">unchanged:</text><text x="596" y="138" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">stop at 3</text></g><g class="st" style="--i:3"><circle cx="376" cy="182" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="376" y="185.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">4</text><rect x="74" y="186" width="252" height="114" fill="#0F6E56" opacity="0.07"/><text x="390" y="186" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">why it is the least fixed point:</text><text x="390" y="204" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">&#8869; lies below every fixed point x; if f&#8319;(&#8869;) &#8804; x,</text><text x="390" y="218" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">then f&#8319;&#8314;&#185;(&#8869;) &#8804; f(x) = x, because f is monotone.</text><text x="390" y="232" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">So 0, 2, 3 stay at or below 3, 5 and 6 (shaded band),</text><text x="390" y="246" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">and the first repeat is below every fixed point.</text></g><g class="st" style="--i:4"><circle cx="376" cy="258" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="376" y="261.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">5</text><text x="416" y="344" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">0</text><text x="406" y="333" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">0</text><text x="446" y="344" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">1</text><text x="406" y="307" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">1</text><text x="476" y="344" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">2</text><text x="406" y="281" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">2</text><line x1="416" y1="330" x2="476" y2="278" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 3"/><path d="M416 330 V304 H446 V278 H476 V304 H446" stroke="#A32D2D" stroke-width="1.6" fill="none" marker-end="url(#mk-kl)"/><circle cx="416" cy="304" r="4" fill="#A32D2D"/><circle cx="446" cy="278" r="4" fill="#A32D2D"/><circle cx="476" cy="304" r="4" fill="#A32D2D"/><text x="390" y="262" text-anchor="start" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="500">without monotonicity: g: 0&#8594;1, 1&#8594;2, 2&#8594;1</text><text x="500" y="292" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D">1 &#8804; 2 but g(1) = 2 &gt; g(2) = 1;</text><text x="500" y="306" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D">the iteration 0, 1, 2, 1, 2, &#8230;</text><text x="500" y="320" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D">never settles: g has no fixed point</text></g><line x1="362" y1="14" x2="362" y2="338" stroke="#D9D5CA" stroke-width="1.1"/></svg>