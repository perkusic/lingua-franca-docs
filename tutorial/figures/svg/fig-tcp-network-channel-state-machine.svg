<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="State machine of the micro-LF TCP network channel: uninitialized, open, connection in progress, connected, connection failed, lost connection, closed" class="anim" style="--n:3"><defs><marker id="mk-f-csm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect x="36" y="30" width="150" height="40" rx="16" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="111.0" y="53.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">UNINITIALIZED</text><g class="st" style="--i:0"><line x1="186" y1="50" x2="288" y2="50" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><text x="237" y="42" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">open_connection</text><rect x="290" y="24" width="140" height="58" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="360.0" y="43.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">OPEN</text><text x="360.0" y="56.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">server: bind, accept</text><text x="360.0" y="68.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">client: connect</text><line x1="430" y1="50" x2="558" y2="50" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><text x="494" y="42" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">connect pending</text><rect x="560" y="30" width="184" height="40" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="652.0" y="53.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">CONNECTION_IN_PROGRESS</text><circle cx="18" cy="50" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="18" y="53.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="360" y1="82" x2="360" y2="148" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><path d="M652 70 C 652 130, 540 168, 452 170" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><text x="600" y="112" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">connection completes</text><rect x="270" y="150" width="180" height="44" rx="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="360.0" y="168.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">CONNECTED</text><text x="360.0" y="181.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">is_connected() = true</text><line x1="360" y1="194" x2="360" y2="238" stroke="#A32D2D" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><text x="368" y="220" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">read error or peer closed</text><rect x="270" y="240" width="180" height="40" rx="16" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="360.0" y="263.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">LOST_CONNECTION</text><text x="470" y="300" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">entering or leaving CONNECTED calls</text><text x="470" y="312" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">notify(): the scheduler wakes, and</text><text x="470" y="324" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">acquire_tag skips the inputs of</text><text x="470" y="336" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">disconnected channels</text><circle cx="18" cy="172" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="18" y="175.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">2</text></g><g class="st" style="--i:2"><path d="M420 82 C 470 130, 560 200, 600 228" fill="none" stroke="#A32D2D" stroke-width="1.3" marker-end="url(#mk-f-csm)"/><text x="566" y="196" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">bind or connect fails</text><rect x="560" y="230" width="184" height="40" rx="16" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="652.0" y="253.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">CONNECTION_FAILED</text><path d="M270 260 C 150 260, 150 64, 288 60" fill="none" stroke="#9A6410" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-f-csm)"/><path d="M652 230 C 652 190, 520 100, 432 64" fill="none" stroke="#9A6410" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-f-csm)"/><text x="36" y="196" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">wait expected_</text><text x="36" y="208" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">connect_duration,</text><text x="36" y="220" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">reset socket,</text><text x="36" y="232" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">back to OPEN</text><rect x="270" y="316" width="180" height="36" rx="16" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="360.0" y="337.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">CLOSED</text><text x="360" y="370" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">close_connection, from any state</text><circle cx="18" cy="300" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="18" y="303.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">3</text></g></svg>