<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layers of a micro-LF program, from the application through generated code and the runtime core to the two porting interfaces, the platforms and the hardware they need" class="anim" style="--n:4"><defs><marker id="mk-f-lay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="390" y="412" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">everything above the two interfaces is the same on every platform; everything below is what a port provides</text><g class="st" style="--i:0"><rect x="30" y="30" width="720" height="34" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="390.0" y="50.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="500">application: reactors in .ulf, with @platform, @maxwait, @clock_sync, @interface_*</text><rect x="30" y="70" width="720" height="34" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="390.0" y="89.9" text-anchor="middle" class="svgtxt" font-size="9" fill="#042C53">generated C: one project per federate; sizes from @max_pending_events, @buffer, connection counts</text><circle cx="14" cy="46" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="14" y="49.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">1</text></g><g class="st" style="--i:1"><rect x="30" y="112" width="720" height="46" rx="8" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="390.0" y="131.3" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">runtime core (portable C, no heap): scheduler and queues, federated environment, coordinators,</text><text x="390.0" y="144.4" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">PhysicalClock (offset, rate), nanopb messages</text><circle cx="14" cy="132" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="14" y="135.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">2</text></g><g class="st" style="--i:2"><rect x="30" y="168" width="352" height="74" rx="8" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="206.0" y="189.5" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">Platform API</text><text x="206.0" y="202.3" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">get_physical_time, wait_until, wait_for,</text><text x="206.0" y="214.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">wait_until_interruptible, notify;</text><text x="206.0" y="226.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">Mutex lock / unlock</text><rect x="398" y="168" width="352" height="74" rx="8" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="574.0" y="189.5" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">NetworkChannel API (federated only)</text><text x="574.0" y="202.3" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">open_connection, is_connected, send_blocking,</text><text x="574.0" y="214.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">receive callback (async) or poll (polled),</text><text x="574.0" y="226.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">close_connection, free</text><circle cx="14" cy="196" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="14" y="199.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">3</text></g><g class="st" style="--i:3"><rect x="30.0" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="67.0" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">POSIX</text><rect x="110.75" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="147.8" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">Zephyr</text><rect x="191.5" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="228.5" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">RIOT</text><rect x="272.25" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="309.2" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">FreeRTOS</text><rect x="353.0" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="390.0" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">Pico SDK</text><rect x="433.75" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="470.8" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">ESP-IDF</text><rect x="514.5" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="551.5" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">Patmos</text><rect x="595.25" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="632.2" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">FlexPRET</text><rect x="676.0" y="254" width="74" height="30" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="713.0" y="271.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22" font-weight="500">ADuCM355</text><text x="390" y="300" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">operating system, SDK or bare metal</text><rect x="30" y="312" width="230" height="70" rx="8" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="145.0" y="331.4" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D" font-weight="600">time source</text><text x="145.0" y="343.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">monotonic counter readable</text><text x="145.0" y="356.2" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">in ns; resolution sets a floor</text><text x="145.0" y="368.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">on E and on W</text><rect x="275" y="312" width="230" height="70" rx="8" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="390.0" y="331.4" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D" font-weight="600">sleep with wake-up</text><text x="390.0" y="343.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">timer interrupt or OS timeout</text><text x="390.0" y="356.2" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">that an ISR or another thread</text><text x="390.0" y="368.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">can cut short (notify)</text><rect x="520" y="312" width="230" height="70" rx="8" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="635.0" y="331.4" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D" font-weight="600">communication</text><text x="635.0" y="343.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">Ethernet or Wi-Fi (TCP, CoAP),</text><text x="635.0" y="356.2" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">UART, BLE radio, S4NOC;</text><text x="635.0" y="368.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">plus a critical section</text><circle cx="14" cy="296" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="14" y="299.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">4</text></g></svg>