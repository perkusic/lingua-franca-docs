<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grant decision flow">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<rect x="270" y="22" width="220" height="52" rx="9" fill="#F2F0E9" stroke="#8A867B" stroke-width="1"/>
<text x="380" y="44" text-anchor="middle" class="svgtxt" font-size="12.5" font-weight="500" fill="#1B1E22">NET(g) or LTC arrives</text>
<text x="380" y="61" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">compute EIMT and strict EIMT</text>
<line x1="310" y1="76" x2="160" y2="130" stroke="#0F6E56" stroke-width="1.1" marker-end="url(#ah2)"/>
<line x1="380" y1="76" x2="380" y2="130" stroke="#9A6410" stroke-width="1.1" marker-end="url(#ah2)"/>
<line x1="450" y1="76" x2="600" y2="130" stroke="#8A867B" stroke-width="1.1" marker-end="url(#ah2)"/>
<rect x="45" y="134" width="230" height="88" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<text x="160" y="158" text-anchor="middle" class="svgtxt" font-size="13" font-weight="500" fill="#04342C">TAG</text>
<text x="160" y="177" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#085041">EIMT &gt; NET</text>
<text x="160" y="193" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#085041">grant latest tag &lt; EIMT</text>
<text x="160" y="209" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#085041">(maximal, not minimal)</text>
<rect x="265" y="134" width="230" height="88" rx="9" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.2"/>
<text x="380" y="158" text-anchor="middle" class="svgtxt" font-size="13" font-weight="500" fill="#633806">PTAG</text>
<text x="380" y="177" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B">EIMT == NET, node in a</text>
<text x="380" y="193" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B">zero-delay cycle, and</text>
<text x="380" y="209" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B">strict EIMT &gt; NET</text>
<rect x="485" y="134" width="230" height="88" rx="9" fill="#F2F0E9" stroke="#8A867B" stroke-width="1"/>
<text x="600" y="158" text-anchor="middle" class="svgtxt" font-size="13" font-weight="500" fill="#1B1E22">Wait</text>
<text x="600" y="177" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">a genuine outside threat</text>
<text x="600" y="193" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">exists; a future NET/LTC</text>
<text x="600" y="209" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">re-triggers the check</text>
<line x1="380" y1="224" x2="380" y2="262" stroke="#9A6410" stroke-width="1.1" marker-end="url(#ah2)"/>
<text x="380" y="284" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#854F0B">PTAG propagates transitively upstream through the zero-delay cycle; upgrades to TAG where provable</text>
</svg>