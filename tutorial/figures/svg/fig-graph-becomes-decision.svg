<svg viewBox="0 0 760 546" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four steps from the federation graph to the grant decision for A: paths, matrix column, EIMT, strict EIMT" class="anim" style="--n:4"><defs><marker id="mk-eimt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="380.0" y="22" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">the federation of section 4.13 at moment one: NET(S) = (50,0), NET(A) = NET(B) = NET(C) = (20,0); A asks for (20,0)</text><g class="st" style="--i:0"><rect x="20" y="36" width="350" height="236" rx="10" fill="none" stroke="#D9D5CA" stroke-width="1"/><circle cx="38" cy="54" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="38" y="57.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="54" y="58" text-anchor="start" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="500">Which nodes can reach A?</text><text x="54" y="73" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">follow every path that ends at A</text><line x1="82" y1="154" x2="133" y2="154" stroke="#185FA5" stroke-width="2.2" marker-end="url(#mk-eimt)"/><text x="109.0" y="146" text-anchor="middle" class="svgtxt" font-size="10" fill="#042C53">0</text><path d="M166 141 Q200.0 102 232 139" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#mk-eimt)"/><text x="200.0" y="116" text-anchor="middle" class="svgtxt" font-size="10" fill="#042C53">0</text><path d="M234 167 Q200.0 206 168 169" fill="none" stroke="#185FA5" stroke-width="2.2" marker-end="url(#mk-eimt)"/><text x="200.0" y="200" text-anchor="middle" class="svgtxt" font-size="10" fill="#042C53">0</text><line x1="264" y1="154" x2="313" y2="154" stroke="#8A867B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mk-eimt)"/><text x="290.0" y="146" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#8A867B">10 ms</text><circle cx="64" cy="154" r="17" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.3"/><text x="64" y="158" text-anchor="middle" class="svgtxt" font-size="12" fill="#042C53" font-weight="500">S</text><circle cx="154" cy="154" r="17" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.3"/><text x="154" y="158" text-anchor="middle" class="svgtxt" font-size="12" fill="#04342C" font-weight="500">A</text><circle cx="246" cy="154" r="17" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.3"/><text x="246" y="158" text-anchor="middle" class="svgtxt" font-size="12" fill="#042C53" font-weight="500">B</text><circle cx="334" cy="154" r="17" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.3" stroke-dasharray="3 3"/><text x="334" y="158" text-anchor="middle" class="svgtxt" font-size="12" fill="#5C6066" font-weight="500">C</text><text x="334" y="188" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">no path to A</text><text x="38" y="242" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">paths into A: S&#8594;A, B&#8594;A, and A&#8594;B&#8594;A</text><text x="38" y="258" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">every one at delay 0: A is upstream of itself</text></g><g class="st" style="--i:1"><rect x="390" y="36" width="350" height="236" rx="10" fill="none" stroke="#D9D5CA" stroke-width="1"/><circle cx="408" cy="54" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="408" y="57.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text><text x="424" y="58" text-anchor="start" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="500">Read the column for A</text><text x="424" y="73" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">the matrix already holds each least path delay</text><rect x="530.0" y="92" width="68" height="128" rx="5" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.6"/><text x="436" y="109" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500"></text><text x="488.0" y="109" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">&#8594; S</text><text x="564.0" y="109" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">&#8594; A</text><text x="640.0" y="109" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">&#8594; B</text><text x="716.0" y="109" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">&#8594; C</text><text x="436" y="135" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">from S</text><text x="488.0" y="135" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="564.0" y="135" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">(0,0)</text><text x="640.0" y="135" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(0,0)</text><text x="716.0" y="135" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(10ms,0)</text><text x="436" y="161" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">from A</text><text x="488.0" y="161" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="564.0" y="161" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">(0,0)</text><text x="640.0" y="161" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(0,0)</text><text x="716.0" y="161" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(10ms,0)</text><text x="436" y="187" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">from B</text><text x="488.0" y="187" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="564.0" y="187" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">(0,0)</text><text x="640.0" y="187" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(0,0)</text><text x="716.0" y="187" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">(10ms,0)</text><text x="436" y="213" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">from C</text><text x="488.0" y="213" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="564.0" y="213" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#8A867B">FOREVER</text><text x="640.0" y="213" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="716.0" y="213" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">FOREVER</text><text x="408" y="242" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">column A: S, A and B reach A at (0,0);</text><text x="408" y="258" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">FOREVER from C means no path, so C is ignored</text></g><g class="st" style="--i:2"><rect x="20" y="292" width="350" height="236" rx="10" fill="none" stroke="#D9D5CA" stroke-width="1"/><circle cx="38" cy="310" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="38" y="313.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text><text x="54" y="314" text-anchor="start" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="500">Push each NET through its delay</text><text x="54" y="329" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">EIMT(A) = min of NET(i) &#8853; delay(i &#8594; A)</text><text x="52" y="363" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">S</text><text x="72" y="363" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">(50,0) &#8853; (0,0) = (50,0)</text><rect x="36" y="377" width="318" height="24" rx="5" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.3"/><text x="52" y="393" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">A</text><text x="72" y="393" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">(20,0) &#8853; (0,0) = (20,0)</text><text x="344" y="393" text-anchor="end" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">min</text><rect x="36" y="407" width="318" height="24" rx="5" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.3"/><text x="52" y="423" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">B</text><text x="72" y="423" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">(20,0) &#8853; (0,0) = (20,0)</text><text x="344" y="423" text-anchor="end" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">min</text><text x="52" y="453" text-anchor="middle" class="svgtxt" font-size="11" fill="#8A867B" font-weight="600">C</text><text x="72" y="453" text-anchor="start" class="svgtxt" font-size="10" fill="#8A867B">FOREVER in the column: skipped</text><rect x="36.0" y="478" width="318" height="38" rx="6" fill="#FBEDEA" stroke="#A32D2D" stroke-width="0.9"/><text x="195.0" y="494" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">EIMT(A) = (20,0) = NET(A): a tie.</text><text x="195.0" y="508" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">Something might still reach A at 20: no TAG</text></g><g class="st" style="--i:3"><rect x="390" y="292" width="350" height="236" rx="10" fill="none" stroke="#D9D5CA" stroke-width="1"/><circle cx="408" cy="310" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="408" y="313.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">4</text><text x="424" y="314" text-anchor="start" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="500">Is the threat from outside the cycle?</text><text x="424" y="329" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">strict EIMT: immediate upstreams not in the cycle</text><text x="408" y="362" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">immediate upstreams of A: S and B</text><rect x="415.0" y="381" width="30" height="22" rx="4" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="430" y="396" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#042C53" font-weight="500">B</text><line x1="418.0" y1="400" x2="442.0" y2="384" stroke="#A32D2D" stroke-width="1.5"/><text x="454" y="396" text-anchor="start" class="svgtxt" font-size="10" fill="#5C6066">in the zero-delay cycle with A: skipped</text><rect x="415.0" y="413" width="30" height="22" rx="4" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="430" y="428" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#04342C" font-weight="500">S</text><text x="454" y="422" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">min(NET(S), EIMT(S)) &#8853; (0,0)</text><text x="454" y="437" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">= min((50,0), FOREVER) = (50,0)</text><rect x="406.0" y="464" width="318" height="52" rx="6" fill="#FAF0DC" stroke="#9A6410" stroke-width="0.9"/><text x="565.0" y="480" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">EIMT_strict(A) = (50,0) &gt; NET(A) = (20,0)</text><text x="565.0" y="494" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">the tie is the cycle&#8217;s own</text><text x="565.0" y="508" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">decision: PTAG(20,0)</text></g></svg>