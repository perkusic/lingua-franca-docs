eceived</text><circle cx="30" cy="100" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="30" y="103.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="560" y1="156" x2="260" y2="176" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-f-cmsc)"/><text x="410.0" y="160" text-anchor="middle" class="svgtxt" font-size="9" fill="#9A6410">DelayRequest</text><text x="568" y="160" text-anchor="start" class="svgtxt" font-size="9" fill="#854F0B">T3: sent</text><text x="252" y="180" text-anchor="end" class="svgtxt" font-size="9" fill="#042C53">T4: received</text><line x1="260" y1="198" x2="560" y2="218" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-cmsc)"/><text x="410.0" y="202" text-anchor="middle" class="svgtxt" font-size="9" fill="#185FA5">DelayResponse(T4)</text><circle cx="30" cy="176" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="30" y="179.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">2</text></g><g class="st" style="--i:2"><rect x="150" y="238" width="520" height="82" rx="8" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="410.0" y="263.0" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">RTT = (T4 &#8722; T1) &#8722; (T3 &#8722; T2) = 133.1 &#181;s;  one-way delay = RTT / 2 = 66.5 &#181;s</text><text x="410.0" y="276.1" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C" font-weight="600">offset = one-way delay &#8722; (T2 &#8722; T1) = 742 ns</text><text x="410.0" y="288.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">|offset| &gt; 100 ms: step the clock;  otherwise: PI servo (Kp 0.7, Ki 0.3) adjusts the rate</text><text x="410.0" y="300.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">next round after 1 s; the measured round above is from the run of Figure 40</text><circle cx="30" cy="276" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="30" y="279.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">3</text></g></svg>