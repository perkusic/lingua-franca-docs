lves both ports: nothing is above it.</text><text x="426" y="241" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">every fixed point x has x&#8320; &#8849; x, so x = x&#8320;</text></g><g class="st" style="--i:3"><rect x="549" y="182" width="42" height="24" rx="5" fill="none" stroke="#A32D2D" stroke-width="1.6"/><text x="598" y="198" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">x&#8320; in the loop</text><circle cx="412" cy="268" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="412" y="271.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">4</text><text x="426" y="272" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D" font-weight="600">loop variant: x&#8320; = ?? is not maximal;</text><text x="426" y="287" text-anchor="start" class="svgtxt" font-size="9.5" fill="#A32D2D">the argument gives nothing, and lfc rejects it</text></g></svg>