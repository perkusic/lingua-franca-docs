<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="State machine of the micro-LF startup coordinator: uninitialized, connecting, handshaking, negotiating, running, with the joining path and the error case" class="anim" style="--n:4"><defs><marker id="mk-f-ssm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><rect x="38" y="40" width="150" height="46" rx="16" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="113.0" y="59.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22" font-weight="600">UNINITIALIZED</text><text x="113.0" y="72.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#8A867B">after construction</text><g class="st" style="--i:0"><line x1="113" y1="86" x2="113" y2="108" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><rect x="38" y="110" width="150" height="58" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="113.0" y="129.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">CONNECTING</text><text x="113.0" y="142.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">open every channel;</text><text x="113.0" y="154.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">block until all connected</text><circle cx="18" cy="139" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="18" y="142.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="113" y1="168" x2="113" y2="190" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><rect x="38" y="192" width="150" height="64" rx="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="113.0" y="214.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">HANDSHAKING</text><text x="113.0" y="227.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">request + response with</text><text x="113.0" y="239.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">every neighbor (+ state)</text><circle cx="18" cy="224" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="18" y="227.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">2</text></g><g class="st" style="--i:2"><path d="M188 236 C 230 236, 230 300, 252 300" fill="none" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><text x="204" y="300" text-anchor="end" class="svgtxt" font-size="8.5" fill="#854F0B">all neighbors</text><text x="204" y="312" text-anchor="end" class="svgtxt" font-size="8.5" fill="#854F0B">still starting</text><rect x="254" y="276" width="200" height="52" rx="16" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="354.0" y="292.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="600">NEGOTIATING</text><text x="354.0" y="305.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#9A6410">longest_path rounds of</text><text x="354.0" y="317.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#9A6410">proposals; keep the maximum</text><line x1="454" y1="302" x2="518" y2="302" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><text x="486" y="296" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#854F0B">last</text><text x="486" y="318" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#854F0B">round</text><rect x="520" y="270" width="220" height="64" rx="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="630.0" y="292.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">RUNNING</text><text x="630.0" y="305.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">start tag scheduled with the</text><text x="630.0" y="317.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">startup reactions and timers</text><circle cx="232" cy="344" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="232" y="347.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">3</text></g><g class="st" style="--i:3"><path d="M188 210 C 250 210, 260 150, 300 150" fill="none" stroke="#A32D2D" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><text x="232" y="136" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#A32D2D">all neighbors RUNNING</text><rect x="302" y="120" width="210" height="60" rx="8" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="407.0" y="140.5" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D" font-weight="600">join a running federation</text><text x="407.0" y="153.1" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">request the start time; join at</text><text x="407.0" y="165.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">max neighbor time + 50 ms</text><path d="M512 150 C 610 150, 630 210, 630 268" fill="none" stroke="#A32D2D" stroke-width="1.3" marker-end="url(#mk-f-ssm)"/><text x="640" y="200" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">clock stepped;</text><text x="640" y="212" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">JOIN_IMMEDIATELY</text><text x="640" y="224" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">or TIMER_ALIGNED</text><path d="M113 278 L 113 360" fill="none" stroke="#A32D2D" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-f-ssm)"/><rect x="38" y="362" width="200" height="40" rx="8" fill="#fff" stroke="#A32D2D" stroke-width="1.1" stroke-dasharray="4 3"/><text x="138.0" y="378.5" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#A32D2D" font-weight="600">some running, some not:</text><text x="138.0" y="390.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">error, startup aborts</text><text x="486" y="380" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">neighbors joining later announce their joining time;</text><text x="486" y="393" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">it becomes last_known_tag of the inputs they feed</text><circle cx="214" cy="150" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="214" y="153.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">4</text></g></svg>