<svg viewBox="0 0 760 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Message sequence: a zero-delay cycle released by provisional grants" class="anim" style="--n:11"><defs><marker id="mk-ptag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="380.0" y="18" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">A and B feed each other with no after delay: a zero-delay cycle</text><rect x="88.0" y="30" width="104" height="42" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="140" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">A</text><text x="140" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#185FA5">federate</text><line x1="140" y1="72" x2="140" y2="512" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="328.0" y="30" width="104" height="42" rx="8" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="380" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#1B1E22" font-weight="500">RTI</text><text x="380" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">coordinator</text><line x1="380" y1="72" x2="380" y2="512" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="568.0" y="30" width="104" height="42" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="620" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">B</text><text x="620" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#185FA5">federate</text><line x1="620" y1="72" x2="620" y2="512" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><g class="st" style="--i:0"><line x1="140" y1="100" x2="376" y2="100" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="260.0" y="94.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">NET(g)</text></g><g class="st" style="--i:1"><line x1="620" y1="128" x2="384" y2="128" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="500.0" y="122.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">NET(g)</text></g><g class="st" style="--i:2"><rect x="154.0" y="144" width="452" height="38" rx="6" fill="#FBEDEA" stroke="#A32D2D" stroke-width="0.9"/><text x="380" y="160" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">EIMT(A) = g = NET(A): B may still send to A at g,</text><text x="380" y="174" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">and the same holds for B. No TAG is possible for either.</text></g><g class="st" style="--i:3"><rect x="154.0" y="192" width="452" height="38" rx="6" fill="#FAF0DC" stroke="#9A6410" stroke-width="0.9"/><text x="380" y="208" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">strict EIMT, which ignores cycle members, is above g:</text><text x="380" y="222" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">the tie is the cycle&#8217;s own, so a PTAG is safe</text></g><g class="st" style="--i:4"><line x1="380" y1="258" x2="144" y2="258" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="260.0" y="252.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410">PTAG(g)</text></g><g class="st" style="--i:5"><line x1="380" y1="286" x2="616" y2="286" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="500.0" y="280.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410">PTAG(g), also via the walk</text></g><g class="st" style="--i:6"><line x1="140" y1="326" x2="616" y2="326" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-ptag)"/><text x="260" y="320.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">absent on A&#8594;B at g</text></g><g class="st" style="--i:7"><line x1="620" y1="356" x2="144" y2="356" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#mk-ptag)"/><text x="500" y="350.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">message on B&#8594;A at g</text></g><g class="st" style="--i:8"><rect x="120.0" y="372" width="520" height="38" rx="6" fill="#E4F2EC" stroke="#0F6E56" stroke-width="0.9"/><text x="380" y="388" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">each side now knows every input at g: the fixed point,</text><text x="380" y="402" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">computed by the federates, not by the RTI</text></g><g class="st" style="--i:9"><line x1="140" y1="438" x2="376" y2="438" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="260.0" y="432.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">LTC(g)</text></g><g class="st" style="--i:10"><line x1="620" y1="466" x2="384" y2="466" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-ptag)"/><text x="500.0" y="460.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">LTC(g)</text><rect x="190.0" y="482" width="380" height="24" rx="6" fill="#E4F2EC" stroke="#0F6E56" stroke-width="0.9"/><text x="380" y="498" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">g is committed; the next NETs open the next tag</text></g></svg>