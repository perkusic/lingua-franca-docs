<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="State machine of the micro-LF scheduler for one federate: select the next tag, sleep until its time, acquire it by checking the inputs and waiting up to W, commit; and the receive path that schedules messages or turns late ones into safe-to-process violations" class="anim" style="--n:5"><defs><marker id="mk-f-ssch" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="200" y="24" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">main loop (scheduler)</text><text x="600" y="24" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">receive path (channel thread or ISR)</text><line x1="400" y1="34" x2="400" y2="500" stroke="#D9D5CA" stroke-width="1" stroke-dasharray="4 3"/><g class="st" style="--i:0"><rect x="30" y="40" width="340" height="46" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="200.0" y="59.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">SELECT</text><text x="200.0" y="72.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">g = earliest of event queue and system-event queue</text><line x1="200" y1="86" x2="200" y2="110" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><rect x="30" y="112" width="340" height="46" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="200.0" y="131.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">SLEEP until clock = g.t</text><text x="200.0" y="144.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">interruptible: notify() returns to SELECT</text><path d="M30 135 C 4 135, 4 63, 28 63" fill="none" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-f-ssch)"/><path d="M370 135 C 392 135, 392 172, 372 176" fill="none" stroke="#8A867B" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><rect x="232" y="166" width="138" height="30" rx="8" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><text x="301.0" y="177.9" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">system event: handle</text><text x="301.0" y="189.7" text-anchor="middle" class="svgtxt" font-size="8" fill="#5C6066">then SELECT again</text><circle cx="46" cy="56" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="46" y="59.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">1</text></g><g class="st" style="--i:1"><line x1="120" y1="158" x2="120" y2="212" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="126" y="190" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">tag event</text><rect x="30" y="214" width="220" height="50" rx="16" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="140.0" y="229.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="600">ACQUIRE g</text><text x="140.0" y="242.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#9A6410">W = max max_wait over connected</text><text x="140.0" y="254.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#9A6410">inputs with last_known_tag &lt; g</text><line x1="140" y1="264" x2="140" y2="300" stroke="#9A6410" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="146" y="286" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">W &gt; 0</text><rect x="30" y="302" width="220" height="46" rx="16" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.1"/><text x="140.0" y="321.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#854F0B" font-weight="600">WAIT until clock = g.t + W</text><text x="140.0" y="334.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#9A6410">absolute deadline</text><path d="M30 325 C 0 325, 0 63, 28 60" fill="none" stroke="#9A6410" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-f-ssch)"/><text x="8" y="380" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">message</text><text x="8" y="391" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">arrives: SELECT</text><text x="8" y="402" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">again, same</text><text x="8" y="413" text-anchor="start" class="svgtxt" font-size="8.5" fill="#854F0B">deadline</text><circle cx="46" cy="230" r="9" fill="#fff" stroke="#9A6410" stroke-width="1.2"/><text x="46" y="233.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#9A6410" font-weight="600">2</text></g><g class="st" style="--i:2"><path d="M250 239 C 300 239, 300 400, 280 396" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="298" y="300" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">W = 0</text><line x1="140" y1="348" x2="140" y2="396" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="146" y="376" text-anchor="start" class="svgtxt" font-size="8.5" fill="#04342C">deadline reached</text><rect x="100" y="398" width="240" height="60" rx="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="220.0" y="418.7" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">COMMIT g</text><text x="220.0" y="431.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">pop events at g; run reactions by level;</text><text x="220.0" y="443.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">inputs not received are absent</text><path d="M340 428 C 388 428, 388 63, 372 63" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="220" y="478" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#04342C">a reaction whose triggering input has a different</text><text x="220" y="490" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#04342C">intended tag runs tardy, or else its body</text><circle cx="116" cy="414" r="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text x="116" y="417.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">3</text></g><g class="st" style="--i:3"><rect x="430" y="40" width="310" height="46" rx="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="585.0" y="59.9" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">TaggedMessage arrives</text><text x="585.0" y="72.6" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#185FA5">tag &#964; = sender tag (+ after)</text><line x1="585" y1="86" x2="585" y2="112" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><rect x="510" y="114" width="150" height="34" rx="4" fill="#fff" stroke="#185FA5" stroke-width="1.1"/><text x="585.0" y="134.0" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="600">&#964; &gt; current tag ?</text><path d="M510 131 C 486 131, 500 150, 500 170" fill="none" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="462" y="160" text-anchor="end" class="svgtxt" font-size="8.5" fill="#04342C">yes</text><rect x="430" y="172" width="200" height="66" rx="8" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="530.0" y="195.2" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C" font-weight="500">schedule event at &#964;</text><text x="530.0" y="208.2" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">last_known_tag := &#964;</text><text x="530.0" y="220.8" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#0F6E56">notify(): wake the loop</text><circle cx="446" cy="56" r="9" fill="#fff" stroke="#185FA5" stroke-width="1.2"/><text x="446" y="59.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5" font-weight="600">4</text></g><g class="st" style="--i:4"><path d="M660 131 C 712 131, 712 252, 690 262" fill="none" stroke="#A32D2D" stroke-width="1.3" marker-end="url(#mk-f-ssch)"/><text x="716" y="196" text-anchor="start" class="svgtxt" font-size="8.5" fill="#A32D2D">no</text><rect x="510" y="264" width="230" height="82" rx="8" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.1"/><text x="625.0" y="288.7" text-anchor="middle" class="svgtxt" font-size="9" fill="#A32D2D" font-weight="600">safe-to-process violation</text><text x="625.0" y="301.7" text-anchor="middle" class="svgtxt" font-size="9" fill="#1B1E22">schedule at (current t, m + 1)</text><text x="625.0" y="314.8" text-anchor="middle" class="svgtxt" font-size="9" fill="#1B1E22">intended tag &#964; kept</text><text x="625.0" y="327.3" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#5C6066">notify()</text><rect x="430" y="372" width="310" height="74" rx="8" fill="#fff" stroke="#A32D2D" stroke-width="1.1" stroke-dasharray="4 3"/><text x="585.0" y="387.2" text-anchor="middle" class="svgtxt" font-size="9" fill="#1B1E22" font-weight="600">preallocated limits</text><text x="585.0" y="399.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">payload pool full: message dropped,</text><text x="585.0" y="412.1" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">last_known_tag unchanged</text><text x="585.0" y="424.4" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">decode error, event queue full: dropped,</text><text x="585.0" y="436.7" text-anchor="middle" class="svgtxt" font-size="8.5" fill="#1B1E22">last_known_tag still advances</text><circle cx="526" cy="280" r="9" fill="#fff" stroke="#A32D2D" stroke-width="1.2"/><text x="526" y="283.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#A32D2D" font-weight="600">5</text></g></svg>