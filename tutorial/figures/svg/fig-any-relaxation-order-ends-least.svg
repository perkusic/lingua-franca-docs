<svg viewBox="0 0 760 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-node graph relaxed in two orders: the entry for u only decreases, never drops below the least path delay, and ends at it in both orders" class="anim" style="--n:5"><defs><marker id="mk-rx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><g class="st" style="--i:0"><circle cx="22" cy="26" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="22" y="29.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="36" y="30" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">the graph</text><line x1="65.0" y1="112.0" x2="133.0" y2="112.0" stroke="#0F6E56" stroke-width="2" marker-end="url(#mk-rx)"/><text x="100.0" y="105.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">2</text><line x1="165.0" y1="112.0" x2="233.0" y2="112.0" stroke="#1B1E22" stroke-width="1.2" marker-end="url(#mk-rx)"/><text x="200.0" y="105.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text><line x1="162.2" y1="122.1" x2="195.2" y2="174.9" stroke="#0F6E56" stroke-width="2" marker-end="url(#mk-rx)"/><text x="188.6" y="147.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">1</text><line x1="187.8" y1="181.9" x2="154.8" y2="129.1" stroke="#1B1E22" stroke-width="1.2" marker-end="url(#mk-rx)"/><text x="161.4" y="164.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><line x1="207.9" y1="179.3" x2="241.0" y2="126.4" stroke="#0F6E56" stroke-width="2" marker-end="url(#mk-rx)"/><text x="234.3" y="161.3" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56" font-weight="600">1</text><circle cx="50" cy="112" r="15" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="50" y="116" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">u</text><circle cx="150" cy="112" r="15" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="150" y="116" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">x</text><circle cx="250" cy="112" r="15" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="250" y="116" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">e</text><circle cx="200" cy="192" r="15" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="200" y="196" text-anchor="middle" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">y</text><text x="24" y="238" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">delays in ms, microstep 0,</text><text x="24" y="252" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">so &#8853; adds the times</text><text x="24" y="274" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">least u&#8594;e: 4,</text><text x="24" y="288" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">along u&#8594;x&#8594;y&#8594;e</text></g><line x1="282.0" y1="16.0" x2="282.0" y2="350.0" stroke="#D9D5CC" stroke-width="1"/><g class="st" style="--i:1"><circle cx="300" cy="26" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="300" y="29.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text><text x="314" y="30" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">two orders of the section 4.5 recursion, entry d(u)</text><text x="314" y="58" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">x before y:</text><rect x="435.0" y="43" width="34" height="22" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.2" stroke-dasharray="3 3"/><text x="452" y="58" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066" font-weight="500">&#8734;</text><line x1="470.0" y1="54.0" x2="486.0" y2="54.0" stroke="#8A867B" stroke-width="1.2" marker-end="url(#mk-rx)"/><rect x="493.0" y="43" width="34" height="22" rx="4" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.2"/><text x="510" y="58" text-anchor="middle" class="svgtxt" font-size="10" fill="#854F0B" font-weight="500">5</text><line x1="528.0" y1="54.0" x2="544.0" y2="54.0" stroke="#8A867B" stroke-width="1.2" marker-end="url(#mk-rx)"/><rect x="551.0" y="43" width="34" height="22" rx="4" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.2"/><text x="568" y="58" text-anchor="middle" class="svgtxt" font-size="10" fill="#04342C" font-weight="500">4</text><text x="314" y="86" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">y before x:</text><rect x="435.0" y="71" width="34" height="22" rx="4" fill="#fff" stroke="#8A867B" stroke-width="1.2" stroke-dasharray="3 3"/><text x="452" y="86" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066" font-weight="500">&#8734;</text><line x1="470.0" y1="82.0" x2="486.0" y2="82.0" stroke="#8A867B" stroke-width="1.2" marker-end="url(#mk-rx)"/><rect x="493.0" y="71" width="34" height="22" rx="4" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.2"/><text x="510" y="86" text-anchor="middle" class="svgtxt" font-size="10" fill="#04342C" font-weight="500">4</text><text x="314" y="106" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">every change strictly lowers the entry</text></g><g class="st" style="--i:2"><circle cx="300" cy="132" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="300" y="135.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text><text x="314" y="136" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">why lowering must stop</text><text x="314" y="158" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">(1,0) &gt; (0,7) &gt; (0,3) &gt; (0,0)</text><text x="314" y="176" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">each step lowers the time, or keeps it and lowers the microstep:</text><text x="314" y="190" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">pairs of naturals have no infinite descending chain</text></g><g class="st" style="--i:3"><circle cx="300" cy="216" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="300" y="219.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">4</text><text x="314" y="220" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">never below the least</text><text x="314" y="240" text-anchor="start" class="svgtxt" font-size="9.5" fill="#1B1E22">walk  u x y x y e:  2+1+1+1+1 = 6</text><text x="314" y="255" text-anchor="start" class="svgtxt" font-size="9.5" fill="#1B1E22">drop the cycle x y x:  u x y e:  2+1+1 = 4</text><text x="314" y="270" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">every value written is some walk&#8217;s delay, so &#8805; 4</text></g><g class="st" style="--i:4"><circle cx="300" cy="296" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="300" y="299.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">5</text><text x="314" y="300" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">never stuck above the least</text><text x="314" y="320" text-anchor="start" class="svgtxt" font-size="9.5" fill="#5C6066">at rest, d(v) &#8804; delay(v&#8594;w) &#8853; d(w) on every connection:</text><text x="314" y="335" text-anchor="start" class="svgtxt" font-size="9.5" fill="#1B1E22">d(y) &#8804; 1&#8853;0 = 1,  d(x) &#8804; 1&#8853;d(y) &#8804; 2,  d(u) &#8804; 2&#8853;d(x) &#8804; 4</text><text x="314" y="352" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="600">with step 4: d(u) = 4, whichever order ran</text></g></svg>