<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Software evaluates downstream nodes one at a time; hardware evaluates all nodes at once and masks emission" class="anim" style="--n:4"><text x="195.0" y="26" text-anchor="middle" class="svgtxt" font-size="12" fill="#042C53" font-weight="500">Software RTI: a cascade</text><text x="195.0" y="44" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">one node at a time, under one lock</text><circle cx="195.0" cy="84" r="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.2"/><text x="195.0" y="88" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">s</text><text x="219.0" y="80" text-anchor="start" class="svgtxt" font-size="9.5" fill="#185FA5">sends NET</text><line x1="171.8" y1="99" x2="79.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="79.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="183.4" y1="99" x2="137.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="137.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="195.0" y1="99" x2="195.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="195.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="206.6" y1="99" x2="253.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="253.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><circle cx="311.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1" stroke-dasharray="3 3"/><text x="311.0" y="196" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">not downstream</text><g class="st" style="--i:0"><circle cx="79.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="79.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">1</text><rect x="40.0" y="222" width="73.5" height="20" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="76.75" y="236" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">judge 1</text></g><g class="st" style="--i:1"><circle cx="137.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="137.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">2</text><rect x="117.5" y="222" width="73.5" height="20" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="154.25" y="236" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">judge 2</text><text x="137.0" y="200" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">PTAG: walk starts here</text></g><g class="st" style="--i:2"><circle cx="195.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="195.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">3</text><rect x="195.0" y="222" width="73.5" height="20" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="231.75" y="236" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">judge 3</text></g><g class="st" style="--i:3"><circle cx="253.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="253.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">4</text><rect x="272.5" y="222" width="73.5" height="20" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="309.25" y="236" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">judge 4</text></g><text x="195.0" y="266" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">time grows with the downstream set,</text><text x="195.0" y="280" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">and each step sees the writes made before it</text><text x="565.0" y="26" text-anchor="middle" class="svgtxt" font-size="12" fill="#04342C" font-weight="500">Hardware RTI: one snapshot</text><text x="565.0" y="44" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">every node at once, emission masked</text><circle cx="565.0" cy="84" r="16" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.2"/><text x="565.0" y="88" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">s</text><text x="589.0" y="80" text-anchor="start" class="svgtxt" font-size="9.5" fill="#185FA5">sends NET</text><line x1="541.8" y1="99" x2="449.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="449.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="553.4" y1="99" x2="507.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="507.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="565.0" y1="99" x2="565.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="565.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><line x1="576.6" y1="99" x2="623.0" y2="144" stroke="#8A867B" stroke-width="1"/><circle cx="623.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1"/><circle cx="681.0" cy="160" r="16" fill="#fff" stroke="#8A867B" stroke-width="1.1" stroke-dasharray="3 3"/><text x="681.0" y="196" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">not downstream</text><g class="st" style="--i:0"><circle cx="449.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="449.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">1</text><circle cx="507.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="507.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">2</text><circle cx="565.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="565.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">3</text><circle cx="623.0" cy="160" r="16" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.4"/><text x="623.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#04342C" font-weight="500">4</text><circle cx="681.0" cy="160" r="16" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.2"/><text x="681.0" y="164" text-anchor="middle" class="svgtxt" font-size="11" fill="#5C6066" font-weight="500">5</text><text x="681.0" y="208" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">judged, masked</text><rect x="410.0" y="222" width="73.5" height="20" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="446.75" y="236" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C">K cycles</text></g><text x="565.0" y="266" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">fixed per build, and it grows with n;</text><text x="565.0" y="280" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">grants to one node are merged before emission</text><line x1="380.0" y1="12" x2="380.0" y2="290" stroke="#D9D5CA" stroke-width="1"/></svg>