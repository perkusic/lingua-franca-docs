<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two panels: an actor receiving increment and double from two producers can end with 4 or 3; a reactor with two ports at one tag and declared reaction order always ends with 4" class="anim" style="--n:4"><defs><marker id="mk-act" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="195" y="24" text-anchor="middle" class="svgtxt" font-size="12" fill="#042C53" font-weight="600">A &#8212; actors</text><text x="195" y="40" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">no order between the two producers</text><g class="st" style="--i:0"><circle cx="20" cy="186" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="20" y="189.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="34" y="190" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">both messages are pending</text><rect x="24" y="60" width="120" height="40" rx="9" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="84.0" y="76.525" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">producer 1</text><text x="84.0" y="91.22500000000001" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#8A867B">sends A: x + 1</text><rect x="24" y="118" width="120" height="40" rx="9" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="84.0" y="134.525" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">producer 2</text><text x="84.0" y="149.225" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#8A867B">sends B: x &#183; 2</text><rect x="232" y="74" width="130" height="70" rx="9" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="297.0" y="99.1625" text-anchor="middle" class="svgtxt" font-size="11" fill="#042C53" font-weight="500">actor</text><text x="297.0" y="114.08749999999999" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#185FA5">state x = 1</text><text x="297.0" y="127.8125" text-anchor="middle" class="svgtxt" font-size="9" fill="#185FA5">one message at a time</text><line x1="146" y1="80" x2="228" y2="98" stroke="#5C6066" stroke-width="1.2" marker-end="url(#mk-act)"/><line x1="146" y1="138" x2="228" y2="122" stroke="#5C6066" stroke-width="1.2" marker-end="url(#mk-act)"/><text x="186" y="116" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">mailbox</text></g><g class="st" style="--i:1"><circle cx="20" cy="222" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="20" y="225.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text><text x="34" y="226" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">order &#9312; A, then B:</text><text x="180" y="226" text-anchor="start" class="svgtxt" font-size="10.5" fill="#042C53">1 &#8594; 2 &#8594; 4</text><circle cx="330" cy="222" r="13" fill="#FAF0DC" stroke="#9A6410" stroke-width="1.3"/><text x="330" y="226.5" text-anchor="middle" class="svgtxt" font-size="12" fill="#854F0B" font-weight="600">4</text></g><g class="st" style="--i:1"><text x="34" y="260" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">order &#9313; B, then A:</text><text x="180" y="260" text-anchor="start" class="svgtxt" font-size="10.5" fill="#042C53">1 &#8594; 2 &#8594; 3</text><circle cx="330" cy="256" r="13" fill="#FBEDEA" stroke="#A32D2D" stroke-width="1.3"/><text x="330" y="260.5" text-anchor="middle" class="svgtxt" font-size="12" fill="#A32D2D" font-weight="600">3</text></g><g class="st" style="--i:1"><text x="195" y="300" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">both orders admissible: no lost update, no data race</text></g><text x="575" y="24" text-anchor="middle" class="svgtxt" font-size="12" fill="#04342C" font-weight="600">B &#8212; reactors</text><text x="575" y="40" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">both events at tag (0, 0); order declared in the program</text><g class="st" style="--i:0"><circle cx="420" cy="198" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="420" y="201.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">1</text><text x="434" y="202" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">both events are known at (0, 0)</text><rect x="440" y="56" width="300" height="128" rx="12" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="590" y="74" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">reactor Acc &#183; state x = 1</text><rect x="431" y="91" width="18" height="18" rx="3" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.2"/><text x="424" y="104" text-anchor="end" class="svgtxt" font-size="10" fill="#185FA5">inc</text><path d="M404 84 l0 -2" stroke="none"/><rect x="431" y="143" width="18" height="18" rx="3" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.2"/><text x="424" y="156" text-anchor="end" class="svgtxt" font-size="10" fill="#185FA5">dbl</text><path d="M404 136 l0 -2" stroke="none"/><text x="408" y="128" text-anchor="start" class="svgtxt" font-size="9" fill="#185FA5">(0, 0)</text><rect x="496" y="84" width="200" height="32" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="596.0" y="103.25" text-anchor="middle" class="svgtxt" font-size="10" fill="#04342C" font-weight="500">reaction 1 (inc): x = x + 1</text><rect x="496" y="136" width="200" height="32" rx="9" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="596.0" y="155.25" text-anchor="middle" class="svgtxt" font-size="10" fill="#04342C" font-weight="500">reaction 2 (dbl): x = x &#183; 2</text><line x1="450" y1="100" x2="494" y2="100" stroke="#185FA5" stroke-width="1.1" marker-end="url(#mk-act)"/><line x1="450" y1="152" x2="494" y2="152" stroke="#185FA5" stroke-width="1.1" marker-end="url(#mk-act)"/><line x1="596" y1="118" x2="596" y2="134" stroke="#8A867B" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#mk-act)"/><text x="604" y="130" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">declared order</text></g><g class="st" style="--i:1"><circle cx="420" cy="226" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="420" y="229.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">2</text><text x="434" y="230" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">reaction 1 runs first:</text><text x="596" y="230" text-anchor="start" class="svgtxt" font-size="10.5" fill="#04342C">x: 1 &#8594; 2</text></g><g class="st" style="--i:2"><circle cx="420" cy="256" r="9" fill="#fff" stroke="#1B1E22" stroke-width="1.2"/><text x="420" y="259.5" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="600">3</text><text x="434" y="260" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">then reaction 2:</text><text x="596" y="260" text-anchor="start" class="svgtxt" font-size="10.5" fill="#04342C">x: 2 &#8594; 4</text></g><g class="st" style="--i:3"><circle cx="730" cy="256" r="13" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.3"/><text x="730" y="260.5" text-anchor="middle" class="svgtxt" font-size="12" fill="#04342C" font-weight="600">4</text><text x="575" y="300" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#5C6066">the same result in every execution with these inputs</text></g><line x1="390.0" y1="12" x2="390.0" y2="320" stroke="#D9D5CA" stroke-width="1"/></svg>