<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Message sequence: a TAG proved from NETs, then a TAG proved from an LTC" class="anim" style="--n:9"><defs><marker id="mk-nettag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="380.0" y="18" text-anchor="middle" class="svgtxt" font-size="10.5" fill="#5C6066">u sends to e over a connection with after 5 ms</text><rect x="78.0" y="30" width="104" height="42" rx="8" fill="#E8F0F9" stroke="#185FA5" stroke-width="1.1"/><text x="130" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#042C53" font-weight="500">u</text><text x="130" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#185FA5">upstream</text><line x1="130" y1="72" x2="130" y2="410" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="328.0" y="30" width="104" height="42" rx="8" fill="#F2F0E9" stroke="#8A867B" stroke-width="1.1"/><text x="380" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#1B1E22" font-weight="500">RTI</text><text x="380" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#8A867B">coordinator</text><line x1="380" y1="72" x2="380" y2="410" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><rect x="578.0" y="30" width="104" height="42" rx="8" fill="#E4F2EC" stroke="#0F6E56" stroke-width="1.1"/><text x="630" y="46" text-anchor="middle" class="svgtxt" font-size="11.5" fill="#04342C" font-weight="500">e</text><text x="630" y="62" text-anchor="middle" class="svgtxt" font-size="9" fill="#0F6E56">federate</text><line x1="630" y1="72" x2="630" y2="410" stroke="#8A867B" stroke-width="1" stroke-dasharray="4 4"/><g class="st" style="--i:0"><line x1="130" y1="100" x2="376" y2="100" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="255.0" y="94.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">NET(12 ms)</text></g><g class="st" style="--i:1"><line x1="630" y1="128" x2="384" y2="128" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="505.0" y="122.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">NET(15 ms)</text></g><g class="st" style="--i:2"><rect x="145.0" y="144" width="470" height="38" rx="6" fill="#E8F0F9" stroke="#185FA5" stroke-width="0.9"/><text x="380" y="160" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">expensive condition: EIMT(e) = 12 ms + 5 ms = 17 ms,</text><text x="380" y="174" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">above the requested 15 ms</text></g><g class="st" style="--i:3"><line x1="380" y1="206" x2="626" y2="206" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="505.0" y="200.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">TAG(17 ms &#8722; 1 ns, UINT_MAX)</text></g><g class="st" style="--i:4"><line x1="630" y1="236" x2="384" y2="236" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="505.0" y="230.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">LTC(15 ms), for e&#8217;s downstreams</text></g><line x1="20" y1="258" x2="740" y2="258" stroke="#8A867B" stroke-width="0.8" stroke-dasharray="2 4"/><text x="24" y="274" text-anchor="start" class="svgtxt" font-size="9.5" fill="#8A867B">later</text><g class="st" style="--i:5"><line x1="130" y1="290" x2="376" y2="290" stroke="#5C6066" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="255.0" y="284.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">LTC(18 ms)</text></g><g class="st" style="--i:6"><line x1="630" y1="318" x2="384" y2="318" stroke="#185FA5" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="505.0" y="312.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#185FA5">NET(19 ms)</text></g><g class="st" style="--i:7"><rect x="130.0" y="334" width="500" height="38" rx="6" fill="#E4F2EC" stroke="#0F6E56" stroke-width="0.9"/><text x="380" y="350" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">low-cost condition: completed(u) = 18 ms, plus 5 ms,</text><text x="380" y="364" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">gives (23 ms &#8722; 1 ns, UINT_MAX), at least the requested 19 ms</text></g><g class="st" style="--i:8"><line x1="380" y1="398" x2="626" y2="398" stroke="#0F6E56" stroke-width="1.3" marker-end="url(#mk-nettag)"/><text x="505.0" y="392.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#0F6E56">TAG(23 ms &#8722; 1 ns, UINT_MAX): no EIMT needed</text></g></svg>