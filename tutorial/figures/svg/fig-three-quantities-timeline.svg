<svg viewBox="0 0 760 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of two consecutive messages showing queue wait, acceptance, evaluation K, emission bound K_max and interval I; and K against n for one tree and one tree per node" class="anim" style="--n:5"><defs><marker id="mk-tim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1.5 1.5L8 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs><text x="20" y="20" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22" font-weight="500">n = 8, d = 4, one EIMT tree, one two-node zero-delay cycle (z = 2):</text><text x="20" y="35" text-anchor="start" class="svgtxt" font-size="10" fill="#1B1E22">K = 24, K_max = K + (n &#8722; 1)&#183;z = 38, I = K_max &#8722; 4 = 34 cycles</text><text x="84" y="91" text-anchor="end" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">m1</text><text x="84" y="141" text-anchor="end" class="svgtxt" font-size="11" fill="#1B1E22" font-weight="600">m2</text><g class="st" style="--i:0"><path d="M96.0 66 l-5 -8 h10 Z" fill="#185FA5"/><text x="104.0" y="64" text-anchor="start" class="svgtxt" font-size="9" fill="#185FA5">arrives and is accepted at once</text><path d="M138.0 116 l-5 -8 h10 Z" fill="#185FA5"/><text x="146.0" y="114" text-anchor="start" class="svgtxt" font-size="9" fill="#185FA5">arrives</text><rect x="138.0" y="128" width="196.0" height="18" rx="3" fill="url(#hatch-tim)" stroke="#8A867B" stroke-dasharray="3 2"/><text x="236.0" y="141" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#1B1E22">waits in the queue</text></g><g class="st" style="--i:1"><rect x="96.0" y="78" width="168.0" height="18" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="180.0" y="91" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="500">K: evaluate every node</text><line x1="96.0" y1="74" x2="96.0" y2="100" stroke="#04342C" stroke-width="2"/><rect x="334.0" y="128" width="168.0" height="18" rx="3" fill="#E4F2EC" stroke="#0F6E56"/><text x="418.0" y="141" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#04342C" font-weight="500">K: evaluate every node</text><line x1="334.0" y1="124" x2="334.0" y2="150" stroke="#04342C" stroke-width="2"/><text x="337.0" y="162" text-anchor="start" class="svgtxt" font-size="9" fill="#04342C">accepted</text></g><g class="st" style="--i:2"><rect x="264.0" y="78" width="98.0" height="18" rx="3" fill="#FAF0DC" stroke="#9A6410" stroke-dasharray="4 3"/><text x="313.0" y="91" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">walk &#8804; 14</text><path d="M362.0 74 l0 26" stroke="#854F0B" stroke-width="2"/><text x="366.0" y="74" text-anchor="start" class="svgtxt" font-size="9" fill="#854F0B">grants out by K_max</text><rect x="502.0" y="128" width="98.0" height="18" rx="3" fill="#FAF0DC" stroke="#9A6410" stroke-dasharray="4 3"/><text x="551.0" y="141" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">walk &#8804; 14</text><path d="M600.0 124 l0 26" stroke="#854F0B" stroke-width="2"/><text x="604.0" y="124" text-anchor="start" class="svgtxt" font-size="9" fill="#854F0B">grants out by K_max</text></g><g class="st" style="--i:3"><line x1="96.0" y1="172" x2="334.0" y2="172" stroke="#185FA5" stroke-width="1.4" marker-end="url(#mk-tim)" marker-start="url(#mk-tim)"/><text x="215.0" y="186" text-anchor="middle" class="svgtxt" font-size="9.5" fill="#042C53" font-weight="500">I = 34: the next acceptance, at a fixed offset</text><rect x="334.0" y="72" width="28.0" height="80" fill="#185FA5" opacity="0.08"/><text x="366.0" y="186" text-anchor="start" class="svgtxt" font-size="9" fill="#185FA5">4-cycle overlap: m1 dispatches while m2 is decoded</text></g><line x1="96.0" y1="204" x2="726.0" y2="204" stroke="#5C6066" marker-end="url(#mk-tim)"/><line x1="96.0" y1="204" x2="96.0" y2="208" stroke="#5C6066"/><text x="96.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">0</text><line x1="166.0" y1="204" x2="166.0" y2="208" stroke="#5C6066"/><text x="166.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">10</text><line x1="236.0" y1="204" x2="236.0" y2="208" stroke="#5C6066"/><text x="236.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">20</text><line x1="306.0" y1="204" x2="306.0" y2="208" stroke="#5C6066"/><text x="306.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">30</text><line x1="376.0" y1="204" x2="376.0" y2="208" stroke="#5C6066"/><text x="376.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">40</text><line x1="446.0" y1="204" x2="446.0" y2="208" stroke="#5C6066"/><text x="446.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">50</text><line x1="516.0" y1="204" x2="516.0" y2="208" stroke="#5C6066"/><text x="516.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">60</text><line x1="586.0" y1="204" x2="586.0" y2="208" stroke="#5C6066"/><text x="586.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">70</text><line x1="656.0" y1="204" x2="656.0" y2="208" stroke="#5C6066"/><text x="656.0" y="220" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">80</text><text x="84" y="220" text-anchor="end" class="svgtxt" font-size="9" fill="#5C6066">cycle</text><defs><pattern id="hatch-tim" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#D9D5CA" stroke-width="3"/></pattern></defs><g class="st" style="--i:4"><text x="20" y="250" text-anchor="start" class="svgtxt" font-size="10.5" fill="#1B1E22" font-weight="500">K grows with n; how fast depends on the trees</text><line x1="110" y1="412" x2="410" y2="412" stroke="#5C6066"/><line x1="110" y1="412" x2="110" y2="262" stroke="#5C6066"/><text x="104" y="415.0" text-anchor="end" class="svgtxt" font-size="9" fill="#5C6066">0</text><line x1="110" y1="412.0" x2="410" y2="412.0" stroke="#EEEBE3"/><text x="104" y="360.45454545454544" text-anchor="end" class="svgtxt" font-size="9" fill="#5C6066">20</text><line x1="110" y1="357.45454545454544" x2="410" y2="357.45454545454544" stroke="#EEEBE3"/><text x="104" y="305.9090909090909" text-anchor="end" class="svgtxt" font-size="9" fill="#5C6066">40</text><line x1="110" y1="302.9090909090909" x2="410" y2="302.9090909090909" stroke="#EEEBE3"/><text x="80" y="337.0" text-anchor="middle" class="svgtxt" font-size="10" fill="#5C6066">K</text><text x="140.0" y="427" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">n = 4</text><text x="220.0" y="427" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">n = 8</text><text x="300.0" y="427" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">n = 16</text><text x="380.0" y="427" text-anchor="middle" class="svgtxt" font-size="9" fill="#5C6066">n = 32</text><polyline points="140.0,368.3636363636364 220.0,365.6363636363636 300.0,362.9090909090909 380.0,360.1818181818182" fill="none" stroke="#0F6E56" stroke-width="1.8"/><circle cx="140.0" cy="368.3636363636364" r="4" fill="#0F6E56"/><text x="140.0" y="384.3636363636364" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">16</text><circle cx="220.0" cy="365.6363636363636" r="4" fill="#0F6E56"/><text x="220.0" y="381.6363636363636" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">17</text><circle cx="300.0" cy="362.9090909090909" r="4" fill="#0F6E56"/><text x="300.0" y="378.9090909090909" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">18</text><circle cx="380.0" cy="360.1818181818182" r="4" fill="#0F6E56"/><text x="380.0" y="376.1818181818182" text-anchor="middle" class="svgtxt" font-size="9" fill="#04342C">19</text><polyline points="140.0,360.1818181818182 220.0,346.54545454545456 300.0,322.0 380.0,275.6363636363636" fill="none" stroke="#9A6410" stroke-width="1.8" stroke-dasharray="5 3"/><rect x="136.0" y="356.1818181818182" width="8" height="8" fill="#9A6410"/><text x="140.0" y="351.1818181818182" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">19</text><rect x="216.0" y="342.54545454545456" width="8" height="8" fill="#9A6410"/><text x="220.0" y="337.54545454545456" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">24</text><rect x="296.0" y="318.0" width="8" height="8" fill="#9A6410"/><text x="300.0" y="313.0" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">33</text><rect x="376.0" y="271.6363636363636" width="8" height="8" fill="#9A6410"/><text x="380.0" y="266.6363636363636" text-anchor="middle" class="svgtxt" font-size="9" fill="#854F0B">50</text><circle cx="440" cy="296" r="4" fill="#0F6E56"/><text x="450" y="300" text-anchor="start" class="svgtxt" font-size="9.5" fill="#04342C">one tree per node: +1 cycle per doubling</text><text x="450" y="314" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">(more area, &#8776; log n)</text><rect x="436" y="334" width="8" height="8" fill="#9A6410"/><text x="450" y="342" text-anchor="start" class="svgtxt" font-size="9.5" fill="#854F0B">a single tree: about +n per doubling</text><text x="450" y="356" text-anchor="start" class="svgtxt" font-size="9" fill="#5C6066">(the Phase 1 budget, &#8776; n)</text><rect x="440.0" y="372" width="300" height="38" rx="6" fill="#F2F0E9" stroke="#8A867B" stroke-width="0.9"/><text x="590" y="388" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">fixed for a given build, not independent</text><text x="590" y="402" text-anchor="middle" class="svgtxt" font-size="10" fill="#1B1E22">of the size the build is made for</text></g></svg>